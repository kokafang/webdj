<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="webdj-online" content="1"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e4e7ee"><title>Jiafeng的网页DJ</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./piano.css"><link rel="stylesheet" href="./deck-banks.css"><link rel="stylesheet" href="./master-fx.css"><script src="./vendor/pitch-native.js" defer></script><script src="./vendor/eq-native.js" defer></script><script type="module" src="./app.mjs"></script><link rel="stylesheet" href="./follow-card.css"><script type="module" src="./follow-card.mjs"></script><link rel="stylesheet" href="./online.css"></head>
<body>
<header class="masthead"><a class="wordmark" href="./" aria-label="Jiafeng的网页DJ 首页">Jiafeng的网页<span>DJ</span></a><nav id="deck-bank-navigation" aria-label="切换 Deck 分组"></nav><div class="header-actions"><button id="import-top" class="dark-button" aria-label="导入素材" title="导入素材">＋</button><button id="open-settings" class="settings-button" aria-label="设置" title="设置" aria-haspopup="dialog" aria-controls="settings-dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button></div></header>
<main><div id="decks" class="decks"></div><section id="master-fx"></section></main>
<footer class="dock"><button id="open-crate" class="load-button" aria-expanded="false" aria-controls="crate"><strong>Load</strong></button></footer>
<section id="crate" class="crate" aria-label="唱片箱" hidden><div class="crate-head"><div class="crate-heading"><h2>CRATE<span>唱片箱</span></h2><span id="library-count">正在读取唱片箱…</span></div><div class="crate-tools"><button id="import-crate">＋ 导入素材</button><button id="refresh-library">↻ 刷新素材</button><button id="close-crate" class="close-button" aria-label="收起唱片箱">收起 ↓</button></div></div><div class="crate-filters"><div class="library-tabs"><button data-filter="all" class="active">全部 Crate <span id="available-count">0</span></button><button data-filter="local">我的导入</button></div><input id="search" type="search" placeholder="搜索名称、调性…" aria-label="搜索素材"></div><div id="categories" class="categories" aria-label="分类"></div><div id="crate-browser" class="crate-browser"></div><div class="crate-bottom"><span id="selection-count"></span><div id="selection-info"></div><div id="selection-actions"></div></div></section>
<div id="import-progress" role="status" hidden><span></span><progress></progress></div><div id="toast" role="status" hidden></div>

<dialog id="edit-dialog"><form id="edit-form"><div class="dialog-head"><h2>编辑素材</h2><button type="button" data-close aria-label="关闭">×</button></div><label>名称<input id="edit-title" required maxlength="300"></label><label>调性<input id="edit-key" maxlength="40" placeholder="例如 Am / F#m / 8A"></label><label>分类<select id="edit-category"></select></label><div class="dialog-actions"><button type="button" data-close>取消</button><button class="dark-button" type="submit">保存</button></div></form></dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-head"><h2 id="settings-title">设置</h2><button data-close aria-label="关闭">×</button></div><div id="appearance-settings" class="appearance-settings"></div><section class="extension-settings"><strong id="extension-state">Chrome 扩展未连接</strong><a href="https://github.com/kokafang/webdj#chrome-扩展" target="_blank" rel="noopener">安装扩展 ↗</a></section><div class="playback-settings"><button id="seek-fade-toggle" type="button" role="switch" aria-checked="true" aria-label="播放淡入淡出" title="扩展音频连接后启用停止淡出"><span>淡入淡出</span><small id="seek-fade-state">停止 · 开</small></button></div><section class="manage-settings" aria-labelledby="manage-title"><h3 id="manage-title">素材管理</h3><div class="settings-actions"><button id="import-settings">＋ 批量导入链接</button><button id="export-library">导出我的曲库 ↗</button></div><p class="small-print">个人修改只保存在当前浏览器。</p><button id="view-all" class="dark-button">查看全部 Crate</button></section></dialog>
<dialog id="import-dialog"><form id="import-form"><div class="dialog-head"><h2>导入链接</h2><button type="button" data-close aria-label="关闭">×</button></div><textarea id="import-text" aria-label="视频链接" placeholder="粘贴 YouTube / Bilibili 链接，也可以粘贴整段聊天记录" required></textarea><output id="import-summary"></output><div class="dialog-actions"><button type="button" data-close>取消</button><button class="dark-button" type="submit">导入</button></div></form></dialog></body></html>
